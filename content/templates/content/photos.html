{% extends 'base.html' %}

{% block title %}Photos{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Photos</h2>
    
    {% for category, photos in categorized_photos.items %}
        <h3>{{ category }}</h3>
        <div class="row">
            {% for photo in photos %}
                <div class="col-md-4">
                    <div class="card mb-4">
                        <img src="{{ photo.url }}" class="card-img-top" alt="{{ photo.title }}">
                        <div class="card-body">
                            <h5 class="card-title">{{ photo.title }}</h5>
                            <p class="card-text">{{ photo.description }}</p>
                            <a href="{{ photo.url }}" class="btn btn-primary" download>Download</a>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    {% endfor %}
</div>
{% endblock %}
